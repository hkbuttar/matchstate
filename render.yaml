# Render Blueprint for the MatchState backend (backend/'s FastAPI app).
# Deploy: connect this repo in the Render dashboard and it will detect this
# file automatically ("New +" -> "Blueprint"), or apply it manually.
#
# Real constraints worth knowing before deploying, not discovered after:
# - Model fitting (Dixon-Coles, Bayesian via NUTS, GBM) happens in a
#   background thread kicked off from FastAPI's lifespan, NOT awaited
#   there -- verified directly against uvicorn's own source that it binds
#   the port only AFTER lifespan startup returns, so a slow synchronous
#   fit previously caused a real failed deploy here ("no open ports
#   detected", timed out) once cold pytensor compilation + BLAS-degraded
#   NUTS sampling on Render's container exceeded the platform's port-scan
#   timeout. With backgrounding, the port opens almost immediately;
#   `/health` instead reports 503 "starting" until the fit finishes, then
#   200 -- Render's healthCheckPath polls and retries on non-200 during
#   the deploy grace period, which is exactly what this is designed for.
# - On Render's free tier, the service spins down after 15 minutes of
#   inactivity; the next request pays the full cold-start cost again (model
#   refit + container boot) -- during that window /health (and any
#   model-dependent route) correctly reports 503 rather than erroring.
#   Fine for a portfolio demo, not for anything latency-sensitive --
#   upgrade to an always-on plan if that matters.
# - The pymc/numba/xgboost/pandas stack's memory footprint hasn't been
#   measured against Render's free-tier RAM limit -- if the service crashes
#   on boot rather than serving, that's the first thing to check.

services:
  - type: web
    name: matchstate-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: CORS_ORIGINS
        sync: false # set to the deployed Vercel frontend URL after that's known
